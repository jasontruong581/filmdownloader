[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filmdownloader"
version = "0.1.0"
description = "Authorized media capture, resolution, and download toolkit"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "selenium>=4.20.0",
]

[project.scripts]
filmdownloader = "videotrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
